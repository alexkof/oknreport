<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ОКН Свердловской области</title>
    <style>
        :root {
            --red-brand: #dc3545;
            --blue-accent: #007bff;
            --background: #f8f9fa;
            --white: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;

            /* Состояния объектов */
            --status-good: #28a745;
            --status-normal: #ffc107;
            --status-bad: #dc3545;
            --status-ruins: #a52a2a;
            --status-not-exists: transparent;
            --status-not-available: #e9ecef;

            /* Цвета иконок */
            --icon-good: #28a745;
            --icon-normal: #ffc107;
            --icon-bad: #dc3545;
            --icon-ruins: #a52a2a;
            --icon-not-exists: #999999;
            --icon-not-available: #666666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--background);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header */
        .header {
            margin-bottom: 2rem;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 1rem;
        }

        .okn-logo {
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(45deg, #dc3545, #fd7e14);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .region-info {
            flex: 1;
        }

        .region-name {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        /* Stats */
        .total-stats {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
            display: inline-block;
        }

        .total-number {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1;
        }

        .total-label {
            font-size: 1.2rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Legend */
        .legend-section {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }

        .legend-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #ddd;
        }

        .legend-color.good { background: var(--status-good); border-color: var(--status-good); }
        .legend-color.normal { background: var(--status-normal); border-color: var(--status-normal); }
        .legend-color.bad { background: var(--status-bad); border-color: var(--status-bad); }
        .legend-color.ruins { background: var(--status-ruins); border-color: var(--status-ruins); }
        .legend-color.not-exists { background: white; border-style: dashed; }
        .legend-color.not-available { background: var(--status-not-available); border-color: var(--status-bad); }

        .legend-text {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        /* Cities */
        .cities-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .city-section {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .city-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--background);
        }

        .city-name {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .city-count {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* Timeline */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .period {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .period-label {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-secondary);
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #e0e0e0;
        }

        .objects-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .heritage-icon {
            width: 28px;
            height: 28px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .heritage-icon:hover {
            transform: scale(1.1);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* Цвета иконок по состоянию */
        .heritage-icon.good { background: #4caf50; }
        .heritage-icon.normal { background: #ff9800; }
        .heritage-icon.bad { background: #f44336; }
        .heritage-icon.ruins { background: #795548; }
        .heritage-icon.not-exists { background: #9e9e9e; opacity: 0.5; }
        .heritage-icon.not-available { background: #9e9e9e; }

        /* SVG иконки */
        .heritage-icon svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--blue-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Error */
        .error {
            background: white;
            border-radius: 15px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .error-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .retry-btn {
            background: var(--blue-accent);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.3s ease;
        }

        .retry-btn:hover {
            background: #0056b3;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .okn-logo {
                font-size: 3rem;
            }

            .region-name {
                font-size: 2rem;
            }

            .total-number {
                font-size: 2.5rem;
            }

            .city-name {
                font-size: 1.5rem;
            }

            .objects-grid {
                grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo-section">
                <div class="okn-logo">ОКН</div>
                <div class="region-info">
                    <div class="region-name">СВЕРДЛОВСКАЯ ОБЛАСТЬ</div>
                </div>
            </div>
        </div>

        <!-- Total Stats -->
        <div class="total-stats">
            <div class="total-number" id="totalCount">-</div>
            <div class="total-label">объектов культурного наследия</div>
        </div>

        <!-- Legend -->
        <div class="legend-section">
            <div class="legend-title">Состояние объектов</div>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color good"></div>
                    <span class="legend-text">Хорошее</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color normal"></div>
                    <span class="legend-text">Нормальное</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color bad"></div>
                    <span class="legend-text">Плохое</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color ruins"></div>
                    <span class="legend-text">Руины</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color not-exists"></div>
                    <span class="legend-text">Не существует</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color not-available"></div>
                    <span class="legend-text">Не доступен</span>
                </div>
            </div>
        </div>

        <!-- Loading State -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Загрузка данных...</p>
        </div>

        <!-- Error State -->
        <div class="error" id="error" style="display: none;">
            <div class="error-icon">⚠️</div>
            <h2>Ошибка загрузки данных</h2>
            <p id="errorMessage">Не удалось загрузить данные из Google Таблиц</p>
            <button class="retry-btn" onclick="loadData()">Повторить</button>
        </div>

        <!-- Cities Container -->
        <div class="cities-container" id="citiesContainer"></div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR1T7ugA8z7TV4CGgorenfTg3joi3SiDPe0QE_Fjs7_DUHB2qYEAt-5qepZFZe42-udQLV4q9XmXnrw/pub?gid=1292008891&single=true&output=csv';

        // Периоды времени
        const TIME_PERIODS = [
            { id: 'before-1800', label: 'до 1800 года', min: 0, max: 1799 },
            { id: '1800-1850', label: '1800-1850', min: 1800, max: 1850 },
            { id: '1850-1880', label: '1850-1880', min: 1850, max: 1880 },
            { id: '1880-1900', label: '1880-1900', min: 1880, max: 1900 },
            { id: '1900-1940', label: '1900-1940', min: 1900, max: 1940 },
            { id: 'after-1940', label: 'после 1940', min: 1940, max: 9999 }
        ];

        // Парсинг CSV с учетом кавычек
        function parseCSV(csv) {
            const lines = csv.split('\n');
            if (lines.length < 2) return [];

            // Парсим заголовки
            const headers = parseCSVLine(lines[0]);
            const data = [];

            // Парсим строки данных
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;

                const values = parseCSVLine(lines[i]);
                const row = {};

                headers.forEach((header, index) => {
                    row[header] = values[index] || '';
                });

                data.push(row);
            }

            console.log('Parsed headers:', headers);
            console.log('Parsed data rows:', data.length);
            return data;
        }

        // Парсинг одной строки CSV с учетом кавычек
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];

                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }

            result.push(current.trim());
            return result;
        }

        // Извлечение года из периода
        function extractYearFromPeriod(period) {
            if (!period) return 0;

            // Ищем первое число в строке (например "с 1850 до 1880" → 1850)
            const match = period.match(/\d{4}/);
            return match ? parseInt(match[0]) : 0;
        }

        // Определение состояния объекта
        function getCondition(status) {
            if (!status) return 'not-exists';

            const s = status.toLowerCase().trim();

            if (s.includes('удовлетворительное') || s.includes('хорошее') || s.includes('готово')) return 'good';
            if (s.includes('нормальное') || s.includes('проверяем')) return 'normal';
            if (s.includes('плохое')) return 'bad';
            if (s.includes('руины')) return 'ruins';
            if (s.includes('не существует')) return 'not-exists';
            if (s.includes('не доступен')) return 'not-available';

            return 'not-exists';
        }

        // Определение периода по году
        function determinePeriod(year) {
            const y = parseInt(year) || 0;

            for (const period of TIME_PERIODS) {
                if (y >= period.min && y <= period.max) {
                    return period.id;
                }
            }

            return 'after-1940';
        }

        // Группировка по городам
        function groupByCity(objects) {
            const cities = {};

            objects.forEach(obj => {
                let cityName = obj['Город'] || 'Неизвестный город';

                // Очищаем название города от лишних пробелов и кавычек
                cityName = cityName.trim().replace(/^"|"$/g, '');

                if (!cities[cityName]) {
                    cities[cityName] = {
                        name: cityName,
                        objects: [],
                        count: 0
                    };
                }

                cities[cityName].objects.push(obj);
                cities[cityName].count++;
            });

            // Сортировка по убыванию количества объектов
            return Object.values(cities).sort((a, b) => b.count - a.count);
        }

        // Группировка по периодам
        function groupByPeriod(objects) {
            const periods = {};

            TIME_PERIODS.forEach(period => {
                periods[period.id] = {
                    label: period.label,
                    objects: []
                };
            });

            objects.forEach(obj => {
                const periodText = obj['Период'] || '';
                const year = extractYearFromPeriod(periodText);
                const period = determinePeriod(year);

                if (periods[period]) {
                    periods[period].objects.push(obj);
                }
            });

            return periods;
        }

        // Маппинг названий иконок из CSV в ключи SVG_ICONS
        function getIconSVG(iconName) {
            if (!iconName) return SVG_ICONS['house'];

            const name = iconName.trim().toLowerCase();

            // Маппинг русских названий в английские ключи
            const iconMap = {
                'домик': 'house',
                'изба': 'house',
                'церковь': 'church',
                'дворец': 'palace',
                'мост': 'bridge',
                'башня': 'tower',
                'монумент': 'monument',
                'ансамбль': 'ensemble',
                'ворота': 'gate',
                'амбар': 'barn',
                'завод': 'house',  // используем house для заводов
                'многоэтажка': 'house'  // используем house для многоэтажек
            };

            const iconKey = iconMap[name] || 'house';
            return SVG_ICONS[iconKey] || SVG_ICONS['house'];
        }

        // Рендеринг объекта
        function renderObject(obj) {
            const name = obj['Название'] || 'Без названия';
            const status = obj['Состояние'] || '';
            const condition = getCondition(status);
            const iconName = obj['Иконка'] || '';
            const iconSVG = getIconSVG(iconName);

            return `
                <div class="heritage-icon ${condition}" title="${name}">
                    ${iconSVG}
                </div>
            `;
        }

        // Рендеринг периода
        function renderPeriod(period, objects) {
            if (objects.length === 0) return '';

            const objectsHtml = objects.map(obj => renderObject(obj)).join('');

            return `
                <div class="period">
                    <div class="period-label">${period.label} (${objects.length})</div>
                    <div class="objects-grid">
                        ${objectsHtml}
                    </div>
                </div>
            `;
        }

        // Рендеринг города
        function renderCity(city) {
            const periods = groupByPeriod(city.objects);

            let periodsHtml = '';
            TIME_PERIODS.forEach(period => {
                periodsHtml += renderPeriod(period, periods[period.id].objects);
            });

            return `
                <div class="city-section">
                    <div class="city-header">
                        <div class="city-name">${city.name}</div>
                        <div class="city-count">${city.count} объектов</div>
                    </div>
                    <div class="timeline">
                        ${periodsHtml}
                    </div>
                </div>
            `;
        }

        // Загрузка данных
        async function loadData() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const citiesContainer = document.getElementById('citiesContainer');
            const totalCount = document.getElementById('totalCount');

            // Показываем загрузку
            loading.style.display = 'block';
            error.style.display = 'none';
            citiesContainer.innerHTML = '';

            try {
                console.log('Fetching CSV from:', CSV_URL);

                // Пробуем загрузить напрямую через localhost
                const response = await fetch(CSV_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const csv = await response.text();
                console.log('CSV loaded, length:', csv.length);

                const data = parseCSV(csv);
                console.log('Objects count:', data.length);

                // Группировка по городам
                const cities = groupByCity(data);
                console.log('Cities:', cities);

                // Обновляем общий счетчик
                totalCount.textContent = data.length;

                // Рендерим города
                cities.forEach(city => {
                    citiesContainer.innerHTML += renderCity(city);
                });

                // Скрываем загрузку
                loading.style.display = 'none';

            } catch (err) {
                console.error('Error loading data:', err);
                loading.style.display = 'none';
                error.style.display = 'block';
                document.getElementById('errorMessage').textContent = err.message;
            }
        }

        // Загрузка при старте
        loadData();
    </script>
