        .heritage-icon:hover {

        .icon-ruins { background: #795548; }
        .icon-none { background: #9e9e9e; }

        /* Типы зданий - SVG иконки */

    <script>
        // Конфигурация
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT3DBHs_v4JtsQWRJRwrj4MR81zV8YgK5uH3zr0LkhsjD-vJyjWHO0bQocoZWZz621XbhkXAzTXKu0B/pub?output=csv';

        // Маппинг иконок из колонки "Иконка" на типы SVG
        const iconMapping = {
            'Мост': 'bridge',
            'Церковь': 'church', 
            'Дворец': 'palace',
            'Домик': 'house',
            'Многоэтажка': 'highrise',
            'Ворота': 'gate',
            'Сарай': 'barn',
            'Ансамбль': 'ensemble',
            'Изба': 'hut'
        };

        // Маппинг состояний
        function getCondition(condition) {
            // Если состояние пустое или отсутствует
            if (!condition || condition.trim() === '') return 'no-data';
            
            const conditionLower = condition.toLowerCase().trim();
            
            // Логируем для отладки
            console.log(`Обрабатываем состояние: "${condition}" → "${conditionLower}"`);
            
            // Хорошее состояние
            if (conditionLower.includes('нормальное') || 
                conditionLower.includes('хорошее') ||
                conditionLower.includes('удовлетворительное')) return 'good';
            
            // Плохое состояние - расширяем варианты
            if (conditionLower.includes('неудовлетворительное') || 
                conditionLower.includes('плохое') ||
                conditionLower.includes('плохо') ||
                conditionLower.includes('аварийное') ||
                conditionLower.includes('критическое') ||
                conditionLower.includes('требует ремонта') ||
                conditionLower.includes('ветхое')) return 'bad';
            
            // Руины и разрушения
            if (conditionLower.includes('частично разрушен') || 
                conditionLower.includes('руины') || 
                conditionLower.includes('разрушена') ||
                conditionLower.includes('разрушен') ||
                conditionLower.includes('разрушено')) return 'ruins';
                
            // Не существует
            if (conditionLower.includes('не осталось') || 
                conditionLower.includes('утрачен') ||
                conditionLower.includes('не существует') ||
                conditionLower.includes('снесен') ||
                conditionLower.includes('снесено')) return 'none';
            
            // Если состояние есть, но не распознано
            console.warn(`Нераспознанное состояние: "${condition}"`);
            return 'unknown';
        }


        // Функция для получения значения из колонки по названию заголовка
        function getColumnValue(row, headers, columnName) {
            const columnIndex = headers.findIndex(header => 
                header.toLowerCase().trim() === columnName.toLowerCase().trim()
            );
            
            if (columnName.toLowerCase() === 'состояние') {
                console.log('Отладка для состояния:');
                console.log('  Ищем колонку:', columnName);
                console.log('  В заголовках:', headers);
                console.log('  Найден индекс:', columnIndex);
                console.log('  Строка данных:', row);
                console.log('  Значение по индексу:', row[columnIndex]);
            }
            
            return columnIndex !== -1 ? (row[columnIndex] || '') : '';
        }

        // Функция для парсинга JSON данных от Google Sheets
        function parseGoogleSheetsJson(jsonData) {
            if (!jsonData.table || !jsonData.table.rows) {
                console.error('Неверный формат данных');
                return [];
            }
            
            const rows = jsonData.table.rows;
            const data = [];
            
            // Получаем заголовки из первой строки
            if (rows.length === 0) return [];
            
            const headers = rows[0].c ? rows[0].c.map(cell => cell && cell.v ? cell.v.toString() : '') : [];
            console.log('Заголовки:', headers);
            
            // Обрабатываем остальные строки
            for (let i = 1; i < rows.length; i++) {
                const row = {};
                const cells = rows[i].c || [];
                
                headers.forEach((header, index) => {
                    const cell = cells[index];
                    row[header] = cell && cell.v !== null ? cell.v.toString() : '';
                });
                
                data.push(row);
            }
            
            return data;
        }

        // Функция для анализа данных
        function analyzeData(data, headers) {
            const stats = { total: 0, good: 0, normal: 0, bad: 0, ruins: 0, none: 0, unknown: 0, 'no-data': 0 };
            const objects = [];
            const uniqueStatuses = new Set();
            const uniqueIcons = new Set();
            
            console.log('Анализируем данные с заголовками:', headers);
            
            data.forEach((row, index) => {
                const cityValue = getColumnValue(row, headers, 'Город');
                console.log(`Строка ${index + 1}:`, row, 'Город:', cityValue);
                
                // Фильтруем только по Каменск-Уральскому
                if (cityValue && cityValue.trim() !== '' && 
                    (cityValue.toLowerCase().includes('каменск') || 
                     cityValue.toLowerCase().includes('kamensk') || 
                     cityValue === 'Каменск-Уральский')) {
                    stats.total++;
                    
                    const conditionValue = getColumnValue(row, headers, 'Состояние');
                    const iconValue = getColumnValue(row, headers, 'Иконка');
                    uniqueStatuses.add(conditionValue);
                    uniqueIcons.add(iconValue);
                    
                    console.log('Состояние из таблицы:', `"${conditionValue}"`, '→ результат:', getCondition(conditionValue));
                    console.log('Иконка из таблицы:', `"${iconValue}"`, '→ маппинг:', iconMapping[iconValue] || 'house');
                    
                    const object = {
                        name: getColumnValue(row, headers, 'Название') || 'Объект культурного наследия',
                        year: parseInt(getColumnValue(row, headers, 'Год') || '0'),
                        condition: getCondition(conditionValue),
                        icon: iconMapping[iconValue] || 'house',
                        iconOriginal: iconValue,
                        address: getColumnValue(row, headers, 'Адрес') || ''
                    };
                    
                    objects.push(object);
                    
                    if (stats.hasOwnProperty(object.condition)) {
                        stats[object.condition]++;
                    }
                }
            });
            
            console.log('Итоговая статистика:', stats);
            console.log('Найдено объектов для Каменск-Уральского:', objects.length);
            console.log('Первые 3 объекта:', objects.slice(0, 3));
            console.log('Все уникальные состояния из таблицы:', Array.from(uniqueStatuses));
            console.log('Все уникальные иконки из таблицы:', Array.from(uniqueIcons));
            console.log('Маппинг иконок:', iconMapping);
            
            // Показываем детальную разбивку по состояниям
            console.log('📊 Детальная статистика по состояниям:');
            console.log(`✅ Хорошее/удовлетворительное: ${stats.good}`);
            console.log(`🔶 Нормальное: ${stats.normal}`);
            console.log(`❌ Плохое/неудовлетворительное: ${stats.bad}`);
            console.log(`🧱 Руины/разрушено: ${stats.ruins}`);
            console.log(`⚫ Не существует/снесено: ${stats.none}`);
            console.log(`⚪ Нет данных о состоянии: ${stats['no-data']}`);
            console.log(`❓ Нераспознанное состояние: ${stats.unknown}`);
            
            return { stats, objects };
        }

        // Функция для обновления статистики
        function updateStatistics(stats) {
            document.querySelector('.stats-number').textContent = stats.total;
            
            // Обновляем счетчики в легенде
            const statusItems = document.querySelectorAll('.status-item');
            statusItems[0].querySelector('.status-count').textContent = stats.good;
            statusItems[1].querySelector('.status-count').textContent = stats.normal;
            statusItems[2].querySelector('.status-count').textContent = stats.bad;
            statusItems[3].querySelector('.status-count').textContent = stats.ruins;
            statusItems[4].querySelector('.status-count').textContent = stats.none;
            
            // Показываем дополнительную статистику в консоли
            console.log('📊 Подробная статистика:');
            console.log(`✅ Хорошее: ${stats.good}`);
            console.log(`🔶 Удовлетворительное: ${stats.normal}`);
            console.log(`❌ Плохое: ${stats.bad}`);
            console.log(`🧱 Руины: ${stats.ruins}`);
            console.log(`⚫ Не существует: ${stats.none}`);
            console.log(`⚪ Нет данных о состоянии: ${stats['no-data']}`);
            console.log(`❓ Нераспознанное состояние: ${stats.unknown}`);
        }

        // Функция для группировки объектов по периодам
        function groupObjectsByPeriod(objects) {
            const periods = {
                'до 1800 года': [],
                '1800-1850': [],
                '1850-1880': [],
                '1880-1900': [],
                '1900-1940': [],
                'после 1940': []
            };

            objects.forEach(obj => {
                const year = obj.year;
                if (year < 1800) {
                    periods['до 1800 года'].push(obj);
                } else if (year >= 1800 && year < 1850) {
                    periods['1800-1850'].push(obj);
                } else if (year >= 1850 && year < 1880) {
                    periods['1850-1880'].push(obj);
                } else if (year >= 1880 && year < 1900) {
                    periods['1880-1900'].push(obj);
                } else if (year >= 1900 && year < 1940) {
                    periods['1900-1940'].push(obj);
                } else if (year >= 1940) {
                    periods['после 1940'].push(obj);
                }
            });

            return periods;
        }

        // SVG иконки
        const svgIcons = {
            house: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="5.68" y="14.39" width="1.63" height="2.48" rx=".41" ry=".41" fill="currentColor"/>
                <rect x="5.68" y="18.27" width="1.63" height="2.48" rx=".41" ry=".41" fill="currentColor"/>
                <rect x="9.15" y="14.39" width="1.63" height="2.48" rx=".41" ry=".41" fill="currentColor"/>
                <rect x="9.15" y="18.27" width="1.63" height="2.48" rx=".41" ry=".41" fill="currentColor"/>
                <rect x="12.9" y="14.39" width="1.63" height="2.48" rx=".41" ry=".41" fill="currentColor"/>
                <rect x="12.9" y="18.27" width="1.63" height="2.48" rx=".41" ry=".41" fill="currentColor"/>
                <rect x="16.41" y="14.39" width="1.63" height="2.48" rx=".41" ry=".41" fill="currentColor"/>
                <rect x="16.41" y="18.27" width="1.63" height="2.48" rx=".41" ry=".41" fill="currentColor"/>
                <path d="M22.31,12.21l-1.91-2.45c-.12-.16-.31-.25-.51-.25h-5.37l-2.12-1.69c-.23-.18-.56-.19-.79,0l-2.24,1.7h-5.26c-.2,0-.39.09-.51.25l-1.91,2.45c-.15.19-.18.46-.07.68s.33.36.58.36h.65v9.31c0,.36.29.64.64.64h17.02c.36,0,.64-.29.64-.64v-9.31h.65c.25,0,.47-.14.58-.36s.08-.48-.07-.68ZM19.58,10.8l.91,1.16h-2.88l-1.46-1.16h3.44ZM11.99,9.14l3.06,2.44.49.39h-7.27l1.71-1.3s0,0,0,0l2.01-1.53ZM4.42,10.8h3.25l-1.54,1.16h-2.62l.91-1.16ZM19.87,21.91H4.13v-8.66h15.73v8.66Z" fill="currentColor"/>

        // Функция для обновления временной шкалы
        function updateTimeline(objects) {
            const periods = groupObjectsByPeriod(objects);
            const timeline = document.querySelector('.timeline');
            
            timeline.innerHTML = '';
            
            Object.entries(periods).forEach(([periodName, periodObjects]) => {
                if (periodObjects.length > 0) {
                    const periodDiv = document.createElement('div');
                    periodDiv.className = 'period';
                    
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'period-title';
                    titleDiv.textContent = periodName;
                    
                    const iconsRow = document.createElement('div');
                    iconsRow.className = 'icons-row';
                    
                    periodObjects.forEach(obj => {
                        const iconDiv = document.createElement('div');
                        iconDiv.className = `heritage-icon icon-${obj.condition} ${obj.icon}`;
                        iconDiv.title = `${obj.name} (${obj.year})`;
                        iconDiv.innerHTML = svgIcons[obj.icon] || svgIcons.house;
                        iconsRow.appendChild(iconDiv);
                    });
                    
                    periodDiv.appendChild(titleDiv);
                    periodDiv.appendChild(iconsRow);
                    timeline.appendChild(periodDiv);
                }
            });
        }

        // Функция для загрузки данных через JSONP
        function loadDataViaJsonp() {
            return new Promise((resolve, reject) => {
                // Создаем уникальное имя callback функции
                const callbackName = 'googleSheetsCallback_' + Date.now();
                
                // Создаем callback функцию
                window[callbackName] = function(data) {
                    // Удаляем script элемент и callback функцию
                    document.head.removeChild(script);
                    delete window[callbackName];
                    resolve(data);
                };
                
                // Создаем script элемент для JSONP запроса
                const script = document.createElement('script');
                script.onerror = function() {
                    document.head.removeChild(script);
                    delete window[callbackName];
                    reject(new Error('Ошибка загрузки данных'));
                };
                
                // Формируем URL с callback параметром
                const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&tq&sheet=${encodeURIComponent(SHEET_NAME)}&headers=1`;
                script.src = url;
                
                document.head.appendChild(script);
            });
        }

        // Главная функция загрузки данных
        async function loadData() {
            try {
                console.log('Загружаем данные из Google Sheets CSV...');
                
                // Пробуем через CORS proxy с новой ссылкой
                const proxyUrl = 'https://api.allorigins.win/raw?url=';
                const response = await fetch(proxyUrl + encodeURIComponent(CSV_URL));
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const csvText = await response.text();
                console.log('Получили CSV данные (полный текст):', csvText);
                
                // Простой парсинг CSV
                const lines = csvText.split('\n').filter(line => line.trim());
                console.log('Количество строк после фильтрации:', lines.length);
                const data = [];
                let headers = [];
                
                if (lines.length > 1) {
                    // Правильный парсинг CSV с учетом кавычек
                    headers = parseCSVLine(lines[0]);
                    console.log('Все заголовки таблицы:', headers);
                    console.log('Ищем колонку с состоянием среди:', headers.filter(h => h.toLowerCase().includes('состо')));
                    
                    for (let i = 1; i < lines.length; i++) {
                        const values = parseCSVLine(lines[i]);
                        data.push(values);
                    }
                } else {
                    throw new Error('Недостаточно данных в CSV файле');
                }
                
                // Функция для правильного парсинга CSV строки
                function parseCSVLine(line) {
                    const result = [];
                    let current = '';
                    let inQuotes = false;
                    
                    for (let i = 0; i < line.length; i++) {
                        const char = line[i];
                        
                        if (char === '"') {
                            inQuotes = !inQuotes;
                        } else if (char === ',' && !inQuotes) {
                            result.push(current.trim());
                            current = '';
                        } else {
                            current += char;
                        }
                    }
                    
                    result.push(current.trim());
                    return result;
                }
                
                const { stats, objects } = analyzeData(data, headers);
                
                console.log('Статистика:', stats);
                console.log('Объекты:', objects.length);
                
                updateStatistics(stats);
                updateTimeline(objects);
                
                console.log('Данные успешно загружены и отображены');
                
            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                
                // Показываем сообщение об ошибке
                const timeline = document.querySelector('.timeline');
                timeline.innerHTML = `
                    <div style="text-align: center; padding: 20px; color: #666;">
                        <p>Не удалось загрузить данные</p>
                        <p style="font-size: 12px;">${error.message}</p>
                        <button onclick="loadData()" style="margin-top: 10px; padding: 5px 10px;">Повторить</button>
                    </div>
                `;
            }
        }

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            // Интерактивность для кнопок фильтров
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            // Интерактивность для кнопок просмотра
            document.querySelectorAll('.btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            // Загружаем данные
            loadData();
            
            // Автообновление каждые 5 минут
            setInterval(loadData, 5 * 60 * 1000);
        });
    </script>
