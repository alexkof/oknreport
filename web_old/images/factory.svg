  <rect x="5.5" y="14" width="2" height="2" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <rect x="9" y="14" width="2" height="2" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <rect x="12.5" y="14" width="2" height="2" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Large entrance -->
