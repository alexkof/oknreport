  <circle cx="7" cy="3" r="0.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <circle cx="13" cy="5" r="0.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <circle cx="19" cy="7" r="0.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
