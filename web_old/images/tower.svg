<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tower base -->
  <rect x="9" y="16" width="6" height="4" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Tower main body -->
  <rect x="10" y="8" width="4" height="8" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Tower top/tank -->
  <ellipse cx="12" cy="6" rx="3" ry="2" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Support legs -->
  <line x1="9" y1="16" x2="10" y2="8" stroke="currentColor" stroke-width="1.5"/>
  <line x1="15" y1="16" x2="14" y2="8" stroke="currentColor" stroke-width="1.5"/>
  <!-- Cross bracing -->
  <line x1="10" y1="10" x2="12" y2="12" stroke="currentColor" stroke-width="1.5"/>
  <line x1="14" y1="10" x2="12" y2="12" stroke="currentColor" stroke-width="1.5"/>
  <line x1="10" y1="14" x2="12" y2="12" stroke="currentColor" stroke-width="1.5"/>
  <line x1="14" y1="14" x2="12" y2="12" stroke="currentColor" stroke-width="1.5"/>
  <!-- Access ladder -->
  <line x1="11" y1="8" x2="11" y2="16" stroke="currentColor" stroke-width="1.5"/>
</svg>